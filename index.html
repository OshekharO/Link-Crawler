<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Api Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="https://webformatter.com/image/logo.svg">
    <!-- INCLUDING GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@600&family=Ysabeau+Infant:ital,wght@1,200&display=swap" rel="stylesheet" />

    <!-- ADDITIONAL CSS FOR STYLING -->
    <style>
      body {
        background-color: #121212;
        color: #dcddde;
        font-family: "Ysabeau Infant", sans-serif;
      }

      h1 {
        color: #7289da;
        font-weight: bold;
        text-shadow: 2px 2px #2c2f33;
        text-align: center;
        font-size: 2.5em;
        margin-bottom: 20px;
      }

      /* Table styles here */
      table {
        border-collapse: collapse;
        margin: auto;
      }

      th,
      td {
        border: 1px solid #2c2f33;
        padding: 8px;
        text-align: left;
        font-size: 14px;
      }

      th {
        background-color: #23272a;
      }

      tr:nth-child(even) {
        background-color: #2c2f33;
      }

      a {
        color: #7289da;
        text-decoration: none;
      }

      td a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .status-online {
        color: #43b581;
        font-weight: bold;
      }

      .status-offline {
        color: #f04747;
        font-weight: bold;
      }

      @media screen and (max-width: 600px) {
        td {
          font-size: 12px;
        }
      }

      @media only screen and (min-width: 768px) {
        td {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>API</h1>

      <!-- TABLE CONSTRUCTION-->
      <table id="table">
        <!-- HEADING FORMATION -->
        <thead>
          <tr>
            <th>NAME</th>
            <th>URL</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
      <script>
        $(document).ready(function () {
          // FETCHING DATA FROM JSON FILE WITH ERROR HANDLING
          $.getJSON("apis.json", function (data) {
            if (!Array.isArray(data)) {
              data = Object.values(data);
            }

            // Sort APIs alphabetically by name for better UX
            data.sort(function (a, b) {
              var nameA = (a.name || "").toLowerCase();
              var nameB = (b.name || "").toLowerCase();
              return nameA.localeCompare(nameB);
            });

            var $tbody = $("#table tbody");
            $tbody.empty();

            // ITERATING THROUGH OBJECTS WITH SAFE DOM RENDERING (XSS PREVENTION)
            $.each(data, function (key, value) {
              var status = value.status ? value.status.toLowerCase() : "online";
              var statusClass = status === "offline" ? "status-offline" : "status-online";

              var $tr = $("<tr>");
              
              var $tdName = $("<td>").text(value.name || "");
              
              var $tdUrl = $("<td>");
              var $a = $("<a>").attr("href", value.url || "#").attr("target", "_blank").text(value.url || "");
              $tdUrl.append($a);
              
              var $tdStatus = $("<td>").addClass(statusClass).text(status);
              
              $tr.append($tdName, $tdUrl, $tdStatus);
              $tbody.append($tr);
            });
          }).fail(function (jqxhr, textStatus, error) {
            console.error("Failed to load apis.json:", textStatus, error);
            var $tbody = $("#table tbody");
            $tbody.html("<tr><td colspan='3' style='text-align: center; color: #f04747;'>Failed to load API details. Please try again later.</td></tr>");
          });
        });
      </script>
    </div>
  </body>
</html>
